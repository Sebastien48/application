# Chemin de base pour l'installation de Gradle
distributionBase=GRADLE_USER_HOME

# Chemin où les distributions Gradle seront stockées
distributionPath=wrapper/dists

# URL de distribution de Gradle compatible avec Java 23
distributionUrl=https\://services.gradle.org/distributions/gradle-8.1-all.zip

# Timeout réseau (en millisecondes)
networkTimeout=20000

# Valider l'URL de distribution
validateDistributionUrl=true

# Où stocker l'archive ZIP téléchargée
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
